name: Bootloader OTAFIX

# Raz dziennie sprawdza nowe wydanie oltaco/Adafruit_nRF52_Bootloader_OTAFIX i kopiuje pliki dla płytek nRF52
# z flashera na stronę: /flasher/otafix/<tag>/ + /flasher/otafix.json (czyta to flasher, sekcja „Bootloader OTAFIX”).
on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Wgraj ponownie, nawet jeśli to samo wydanie"
        type: boolean
        default: false

concurrency:
  group: otafix
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sprawdź i pobierz
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          python3 scripts/ftp_sync.py cat "${FTP_DIR%/}/flasher/otafix.json" > current.json 2>/dev/null || rm -f current.json
          set +e
          python3 scripts/otafix_sync.py out current.json
          rc=$?
          set -e
          if [ $rc -eq 3 ]; then echo "new=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $rc -eq 0 ] || exit $rc
          echo "new=1" >> "$GITHUB_OUTPUT"
          echo "tag=$(python3 -c 'import json;print(json.load(open("out/otafix.json"))["tag"])')" >> "$GITHUB_OUTPUT"
      - name: FTP
        if: steps.sync.outputs.new == '1'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          DEST="${FTP_DIR%/}/flasher"
          # najpierw pliki, na końcu otafix.json – flasher nigdy nie wskaże plików, których jeszcze nie ma
          python3 scripts/ftp_sync.py upload out "$DEST" --last otafix.json
          # zostaw tylko bieżące wydanie
          for t in $(python3 scripts/ftp_sync.py ls "$DEST/otafix"); do
            [ "$t" = "${{ steps.sync.outputs.tag }}" ] || python3 scripts/ftp_sync.py rmtree "$DEST/otafix/$t"
          done
          echo "::notice::OTAFIX ${{ steps.sync.outputs.tag }} wgrany na stronę"
