name: Kontrola strony i firmware

on:
  schedule:
    - cron: "17 6 * * *"   # codziennie po porannym sprawdzeniu wydań
  workflow_run:
    workflows: ["Firmware SF6", "Wgraj stronę"]
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Kontrola
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_site.py
