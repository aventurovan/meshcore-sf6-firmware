name: Wgraj stronę

on:
  push:
    branches: [main]
    paths: ["strona/**"]
  workflow_dispatch:

concurrency:
  group: deploy-strona
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: PHP lint
        run: |
          command -v php >/dev/null || { sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq php-cli >/dev/null; }
          find strona -name '*.php' -print0 | xargs -0 -n1 php -l | grep -v "No syntax errors" || true
          ! find strona -name '*.php' -print0 | xargs -0 -n1 php -l 2>&1 | grep -q "Parse error"
      - name: FTP (tylko wgrywanie, nic nie jest kasowane na serwerze)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          command -v lftp >/dev/null || { sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq lftp >/dev/null; }
          L="set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30"
          # pliki .md (instrukcje) zostają tylko w repo
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$L; mirror -R --verbose --parallel=4 --exclude-glob *.md strona/ ${FTP_DIR%/}/; bye"
          echo "::notice::Strona wgrana. Zmienione w tym commicie: $(git diff --name-only HEAD~1 HEAD -- strona | sed 's#^strona/##' | tr '\n' ' ')"
