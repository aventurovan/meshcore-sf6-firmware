name: Test FTP

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Adres folderu flashera na stronie"
        default: "https://meshcoresouth.pl/flasher/"

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sekrety
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          ok=1
          for v in FTP_HOST FTP_USER FTP_PASSWORD FTP_DIR; do
            if [ -z "${!v}" ]; then echo "::error::Brak sekretu $v"; ok=0; else echo "$v: ustawiony"; fi
          done
          [ $ok = 1 ]
          echo "::notice::FTP_DIR = $FTP_DIR"
      - name: Połączenie, zapis, odczyt
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          DEST="${FTP_DIR%/}/flasher"
          python3 scripts/ftp_sync.py rm "${FTP_DIR%/}/ftp-test.txt"
          mkdir -p t && echo "sf6-ftp-test $(date -u +%FT%TZ) $GITHUB_RUN_ID" > t/ftp-test.txt
          python3 scripts/ftp_sync.py upload t "$DEST"
          echo "::notice::FTP OK – zapisano ftp-test.txt w folderze flasher"
      - name: Czy plik jest widoczny na stronie
        run: |
          url="${{ inputs.site_url }}"; url="${url%/}/ftp-test.txt"
          code=$(curl -s -o got.txt -w "%{http_code}" "$url?t=$GITHUB_RUN_ID" || true)
          if [ "$code" = "200" ] && grep -q "$GITHUB_RUN_ID" got.txt; then
            echo "::notice::Strona OK – $url zwraca świeży plik testowy"
            curl -s "${url%/ftp-test.txt}/manifest.json" -o /dev/null -w "manifest.json: HTTP %{http_code}\n" || true
          else
            echo "::error::$url zwraca HTTP $code (albo stary plik). FTP_DIR prawdopodobnie nie wskazuje na folder flasher w katalogu strony."
            exit 1
          fi
      - name: Sprzątanie
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          python3 scripts/ftp_sync.py rm "${FTP_DIR%/}/flasher/ftp-test.txt" && echo "::notice::Plik testowy usunięty"
