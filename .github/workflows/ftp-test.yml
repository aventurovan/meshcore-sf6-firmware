name: Test FTP

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Adres folderu flashera na stronie"
        default: "https://meshcoresouth.pl/flasher/"

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Sekrety
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          ok=1
          for v in FTP_HOST FTP_USER FTP_PASSWORD FTP_DIR; do
            if [ -z "${!v}" ]; then echo "::error::Brak sekretu $v"; ok=0; else echo "$v: ustawiony"; fi
          done
          [ $ok = 1 ]
          echo "::notice::FTP_DIR = $FTP_DIR"
      - name: Połączenie, zapis, odczyt
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          echo "sf6-ftp-test $(date -u +%FT%TZ) $GITHUB_RUN_ID" > ftp-test.txt
          L="set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 20"
          if ! out=$(lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "$L; pwd; mkdir -p $FTP_DIR; cd $FTP_DIR && put ftp-test.txt && cls -l; bye" 2>&1); then
            echo "$out"
            echo "::error::FTP nie działa: $(echo "$out" | tail -n 3 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"
          echo "::notice::FTP OK – zapisano ftp-test.txt w $FTP_DIR. Zawartość: $(echo "$out" | tail -n 8 | awk '{print $NF}' | tr '\n' ' ')"
      - name: Czy plik jest widoczny na stronie
        run: |
          url="${{ inputs.site_url }}"; url="${url%/}/ftp-test.txt"
          code=$(curl -s -o got.txt -w "%{http_code}" "$url?t=$GITHUB_RUN_ID" || true)
          if [ "$code" = "200" ] && grep -q "$GITHUB_RUN_ID" got.txt; then
            echo "::notice::Strona OK – $url zwraca świeży plik testowy"
          else
            echo "::error::$url zwraca HTTP $code (albo stary plik). FTP_DIR prawdopodobnie nie wskazuje na folder flasher w katalogu strony."
            exit 1
          fi
