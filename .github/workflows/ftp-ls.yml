name: Podgląd plików FTP

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Katalog względem katalogu głównego strony (np. meshspeed)"
        default: ""
      cat:
        description: "Pokaż zawartość pliku tekstowego zamiast listy"
        type: boolean
        default: false
      download:
        description: "Pobierz cały katalog jako artefakt (zip)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          P: ${{ inputs.path }}
          CAT: ${{ inputs.cat }}
        run: |
          if [ "$CAT" = "true" ]; then out=$(python3 scripts/ftp_sync.py cat "${FTP_DIR%/}/$P" | head -c 60000); else out=$(python3 scripts/ftp_sync.py ls "${FTP_DIR%/}/$P" | sort | head -200); fi
          echo "$out"
          echo "::notice title=Pliki w /$P::$(echo "$out" | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Pobranie katalogu
        if: ${{ inputs.download }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          P: ${{ inputs.path }}
        run: python3 scripts/ftp_sync.py get "${FTP_DIR%/}/$P" pobrane
      - name: Zapis na gałęzi ftp-pobrane
        if: ${{ inputs.download }}
        env:
          P: ${{ inputs.path }}
        run: |
          git config user.name "sf6-bot"; git config user.email "sf6-bot@users.noreply.github.com"
          git checkout -q --orphan ftp-pobrane
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name .git ! -name pobrane -exec rm -rf {} +
          mkdir -p "kopia/$P" && cp -r pobrane/. "kopia/$P/" && rm -rf pobrane
          git add kopia && git commit -qm "Kopia z FTP: /$P" && git push -fq origin ftp-pobrane
          echo "::notice::Kopia /$P na gałęzi ftp-pobrane"
