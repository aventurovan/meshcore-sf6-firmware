# ============================================================
#  MeshCore Południe SF6 – ustawienia domyślne firmware
#  Zmieniasz tylko ten plik. Wartości trafiają do KAŻDEJ płytki.
#  Działają przy czystej instalacji; aktualizacja zachowuje
#  ustawienia zapisane już w urządzeniu.
# ============================================================

# Radio (preset Południe SF6)
LORA_FREQ=869.618
LORA_BW=62.5
LORA_SF=6
LORA_CR=8
# Moc TX w dBm; puste = domyślna oficjalna (20)
LORA_TX_POWER=

# Repeater i Room Server: adverty
# Lokalny advert (zero-hop) co ile minut: 60–240, wielokrotność 2, 0 = wyłączony (oficjalnie 2).
LOCAL_ADVERT_MINUTES=60
# Flood advert co ile godzin: 3–168, 0 = wyłączony (oficjalnie 47).
FLOOD_ADVERT_HOURS=12

# Długość ID w ścieżce (bajty): 1 = oficjalnie, 2 = preset Południe
PATH_HASH_BYTES=2

# Jakie role budować (nazwy jak w oficjalnych tagach)
TYPES="repeater companion room-server"

# Ile płytek budować w jednym zadaniu Actions (mniej = szybciej, więcej zadań)
CHUNK_SIZE=12
